name: Infinity Archive Catalog Steward

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  steward:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check TMDB secret
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: test -n "$TMDB_API_TOKEN" || (echo "TMDB_API_TOKEN is missing. Add it in Settings > Secrets and variables > Actions." && exit 1)

      - name: Refresh monitored catalog
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
        run: npm run steward:update

      - run: npm run steward:test
      - run: npm run build
      - run: npm run validate:artifact

      - name: Detect catalog change
        id: changes
        run: |
          if git diff --quiet -- app/catalog-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit catalog update
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Infinity Archive Catalog Steward"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/catalog-data.json
          git commit -m "chore(catalog): automated Infinity Archive update"
          git push

      - uses: actions/configure-pages@v6
        if: steps.changes.outputs.changed == 'true'

      - uses: actions/upload-pages-artifact@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          path: ./out

      - name: Deploy refreshed catalog
        id: deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
